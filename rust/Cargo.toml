[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ahash = "0.8.12"
dashmap = "6.2.1"
fast_image_resize = {version = "6.1.0", features = ["image"]}
godot = "0.5.5"
image = "0.25.10"
pdfium = "0.10.4"
pdfium-render = "0.9.4"
png = "0.18.1"
turbojpeg = { version = "1.5.1", features = ["image"] }
webpx = "0.4.0"
